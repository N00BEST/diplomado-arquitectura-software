apiVersion: v1
kind: Secret
metadata:
  name: {{ include "actividad-03.fullname" . }}-db
  labels:
    {{- include "actividad-03.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USER: {{ .Values.db.user | quote }}
  DB_PASSWORD: {{ .Values.db.password | quote }}
  DB_DATABASE: {{ .Values.db.database | quote }}
  DB_PORT: {{ .Values.db.port | quote }}
{{- if .Values.mysql.enabled }}
  MYSQL_ROOT_PASSWORD: {{ .Values.mysql.auth.rootPassword | quote }}
  MYSQL_DATABASE: {{ .Values.mysql.auth.database | quote }}
{{- end }}
