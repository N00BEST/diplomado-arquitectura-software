apiVersion: v1
kind: Service
metadata:
  name: {{ include "actividad-03.fullname" . }}
  labels:
    {{- include "actividad-03.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "actividad-03.appLabels" . | nindent 4 }}
