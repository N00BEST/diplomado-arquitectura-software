apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "actividad-03.fullname" . }}
  labels:
    {{- include "actividad-03.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "actividad-03.appLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "actividad-03.appLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: DB_HOST
              value: {{ include "actividad-03.dbHost" . | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "actividad-03.fullname" . }}-db
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "actividad-03.fullname" . }}-db
                  key: DB_PASSWORD
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "actividad-03.fullname" . }}-db
                  key: DB_DATABASE
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ include "actividad-03.fullname" . }}-db
                  key: DB_PORT
            - name: GIN_MODE
              value: release
          livenessProbe:
            httpGet:
              path: /records
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /records
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
