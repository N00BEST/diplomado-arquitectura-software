replicaCount: 1

image:
  repository: n00best/diplomado-demo
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: actividad-03.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

mysql:
  enabled: true
  image:
    repository: mysql
    tag: "8.4"
    pullPolicy: IfNotPresent
  auth:
    rootPassword: password
    database: actividad-03
    username: root
  service:
    port: 3306
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  resources: {}

db:
  host: ""
  port: "3306"
  user: root
  password: password
  database: actividad-03
