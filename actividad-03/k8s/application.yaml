apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: actividad-03-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: registry-1.docker.io
    chart: n00best/actividad-03
    targetRevision: "1.0.0-2"

    helm:
      values: |
        replicaCount: 2
  destination:
    name: in-cluster
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true